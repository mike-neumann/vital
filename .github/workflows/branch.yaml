on:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: ./gradlew lintCheck --info --stacktrace --refresh-dependencies
  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: ./gradlew clean publishToMavenLocal --info --stacktrace --refresh-dependencies
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: ./gradlew clean test --info --stacktrace --refresh-dependencies
