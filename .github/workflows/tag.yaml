on:
  push:
    tags: [ v*.*.* ]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: ./gradlew lintCheck --info --stacktrace --refresh-dependencies
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: ./gradlew clean test --info --stacktrace --refresh-dependencies
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: ./gradlew clean build --info --stacktrace --refresh-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/.output
